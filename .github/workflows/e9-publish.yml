# Experiment E9 only (spec 000, task T029). Throwaway: delete this file after E9 is recorded.
# Starts only from a tag named e9-* on the speckit branch. Publishes the test package, never the product.
name: e9-publish

on:
  push:
    tags:
      - "e9-*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Check that the tag matches the package version
        working-directory: specs/000-architecture-foundation/experiments/e9-provenance
        run: |
          v="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "e9-${v}" || { echo "Tag ${GITHUB_REF_NAME} does not match version ${v}"; exit 1; }
      - name: Publish the test package with provenance
        working-directory: specs/000-architecture-foundation/experiments/e9-provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
